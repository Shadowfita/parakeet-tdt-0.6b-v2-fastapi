name: AgriLoop live capture

on:
  push:
    branches:
      - automation/agriloop-live-capture-20260827
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture AgriLoop public site
        shell: bash
        run: |
          cat > capture-agriloop.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import crypto from 'node:crypto';

          const ROOT = path.resolve('capture-output');
          const SEGMENTS = path.join(ROOT, 'segments-1920x1080');
          const FULL = path.join(ROOT, 'full-page');
          const STATES = path.join(ROOT, 'interaction-states');
          const DATA = path.join(ROOT, 'page-data');
          const HTML = path.join(ROOT, 'html-snapshots');
          const VIEWPORT = { width: 1920, height: 1080 };
          const OVERLAP = 180;
          const STEP = VIEWPORT.height - OVERLAP;

          await fs.rm(ROOT, { recursive: true, force: true });
          for (const dir of [ROOT, SEGMENTS, FULL, STATES, DATA, HTML]) {
            await fs.mkdir(dir, { recursive: true });
          }

          const seedRoutes = [
            ['home', 'https://agriloop.com.au/'],
            ['launch-buyers', 'https://agriloop.com.au/launch/buyers'],
            ['launch-producers', 'https://agriloop.com.au/launch/growers'],
            ['launch-drivers', 'https://agriloop.com.au/launch/drivers'],
            ['how-it-works', 'https://agriloop.com.au/how-it-works'],
            ['about', 'https://agriloop.com.au/about']
          ];

          const manifest = {
            capturedAtUtc: new Date().toISOString(),
            origin: 'https://agriloop.com.au',
            viewport: { ...VIEWPORT, deviceScaleFactor: 1, aspectRatio: '16:9' },
            overlapPixels: OVERLAP,
            routes: [],
            discoveredInternalPaths: []
          };

          const hash = async (file) => crypto.createHash('sha256').update(await fs.readFile(file)).digest('hex');
          const safeSlug = (value) => value.replace(/^\/+|\/+$/g, '').replace(/[^a-z0-9]+/gi, '-').toLowerCase() || 'home';
          const uniqueNumbers = (values) => [...new Set(values.map((n) => Math.max(0, Math.round(n))))].sort((a, b) => a - b);

          const browser = await chromium.launch({
            headless: true,
            args: ['--disable-dev-shm-usage', '--font-render-hinting=none']
          });
          const context = await browser.newContext({
            viewport: VIEWPORT,
            deviceScaleFactor: 1,
            colorScheme: 'light',
            locale: 'en-AU',
            reducedMotion: 'reduce'
          });

          async function settle(page) {
            await page.waitForLoadState('networkidle', { timeout: 30000 }).catch(() => {});
            await page.evaluate(async () => {
              if (document.fonts?.ready) await document.fonts.ready;
            }).catch(() => {});
            const initialHeight = await page.evaluate(() => Math.max(document.documentElement.scrollHeight, document.body.scrollHeight));
            for (let y = 0; y < initialHeight; y += 600) {
              await page.evaluate((top) => window.scrollTo(0, top), y);
              await page.waitForTimeout(100);
            }
            await page.evaluate(() => window.scrollTo(0, 0));
            await page.waitForTimeout(1200);
            await page.addStyleTag({ content: '*,*::before,*::after{animation-duration:0s!important;animation-delay:0s!important;transition:none!important;scroll-behavior:auto!important}' }).catch(() => {});
          }

          async function collectPageData(page) {
            return page.evaluate(() => {
              const round = (n) => Math.round(n * 10) / 10;
              const style = (el) => {
                if (!el) return null;
                const cs = getComputedStyle(el);
                const r = el.getBoundingClientRect();
                return {
                  tag: el.tagName.toLowerCase(),
                  id: el.id || null,
                  className: typeof el.className === 'string' ? el.className : null,
                  text: (el.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 280),
                  rect: { x: round(r.x), y: round(r.y + scrollY), width: round(r.width), height: round(r.height) },
                  display: cs.display,
                  position: cs.position,
                  gridTemplateColumns: cs.gridTemplateColumns,
                  gap: cs.gap,
                  padding: cs.padding,
                  margin: cs.margin,
                  fontFamily: cs.fontFamily,
                  fontSize: cs.fontSize,
                  fontWeight: cs.fontWeight,
                  lineHeight: cs.lineHeight,
                  letterSpacing: cs.letterSpacing,
                  color: cs.color,
                  backgroundColor: cs.backgroundColor,
                  backgroundImage: cs.backgroundImage,
                  border: cs.border,
                  borderRadius: cs.borderRadius,
                  boxShadow: cs.boxShadow,
                  opacity: cs.opacity
                };
              };

              const rootStyle = getComputedStyle(document.documentElement);
              const cssVariables = {};
              for (let i = 0; i < rootStyle.length; i += 1) {
                const name = rootStyle[i];
                if (name?.startsWith('--')) {
                  const value = rootStyle.getPropertyValue(name).trim();
                  if (value) cssVariables[name] = value;
                }
              }

              const internalPaths = [...document.querySelectorAll('a[href]')].map((a) => {
                try {
                  const u = new URL(a.href, location.href);
                  return u.origin === location.origin ? u.pathname : null;
                } catch { return null; }
              }).filter(Boolean);

              const elements = [...document.querySelectorAll('header,nav,main,section,article,aside,footer,h1,h2,h3,h4,p,ul,ol,li,a,button,label,input,select,textarea,form,img,figure')]
                .slice(0, 700)
                .map(style);

              return {
                url: location.href,
                title: document.title,
                language: document.documentElement.lang,
                viewport: { width: innerWidth, height: innerHeight, devicePixelRatio },
                document: {
                  scrollWidth: document.documentElement.scrollWidth,
                  scrollHeight: Math.max(document.documentElement.scrollHeight, document.body.scrollHeight)
                },
                landmarks: {
                  header: document.querySelectorAll('header').length,
                  nav: document.querySelectorAll('nav').length,
                  main: document.querySelectorAll('main').length,
                  footer: document.querySelectorAll('footer').length
                },
                headings: [...document.querySelectorAll('h1,h2,h3,h4')].map((el) => ({ level: Number(el.tagName.slice(1)), ...style(el) })),
                sections: [...document.querySelectorAll('main section')].map((el, index) => ({ index, ...style(el) })),
                controls: [...document.querySelectorAll('a,button,input,select,textarea')].map((el) => ({
                  ...style(el),
                  type: el.getAttribute('type'),
                  name: el.getAttribute('name'),
                  href: el instanceof HTMLAnchorElement ? el.href : null,
                  ariaLabel: el.getAttribute('aria-label'),
                  placeholder: el.getAttribute('placeholder')
                })),
                forms: [...document.forms].map((form, index) => ({
                  index,
                  action: form.action,
                  method: form.method,
                  fieldCount: form.elements.length,
                  labels: [...form.querySelectorAll('label')].map((label) => (label.textContent || '').replace(/\s+/g, ' ').trim())
                })),
                images: [...document.images].map((img) => ({
                  src: img.currentSrc || img.src,
                  alt: img.alt,
                  naturalWidth: img.naturalWidth,
                  naturalHeight: img.naturalHeight,
                  renderedWidth: round(img.getBoundingClientRect().width),
                  renderedHeight: round(img.getBoundingClientRect().height),
                  loading: img.loading
                })),
                resourceFonts: performance.getEntriesByType('resource').map((r) => r.name).filter((name) => /\.(woff2?|ttf|otf)(\?|$)/i.test(name)),
                cssVariables,
                internalPaths: [...new Set(internalPaths)].sort(),
                elements
              };
            });
          }

          for (const [requestedSlug, requestedUrl] of seedRoutes) {
            const page = await context.newPage();
            console.log(`Capturing ${requestedSlug}: ${requestedUrl}`);
            let response = null;
            let navigationError = null;
            try {
              response = await page.goto(requestedUrl, { waitUntil: 'domcontentloaded', timeout: 90000 });
            } catch (error) {
              navigationError = String(error);
            }

            await settle(page);
            const pageData = await collectPageData(page);
            for (const item of pageData.internalPaths) {
              if (!manifest.discoveredInternalPaths.includes(item)) manifest.discoveredInternalPaths.push(item);
            }

            const slug = requestedSlug || safeSlug(new URL(pageData.url).pathname);
            const dataFile = path.join(DATA, `${slug}.json`);
            const htmlFile = path.join(HTML, `${slug}.html`);
            await fs.writeFile(dataFile, JSON.stringify(pageData, null, 2));
            await fs.writeFile(htmlFile, await page.content());

            const fullFile = path.join(FULL, `${slug}-full.png`);
            await page.screenshot({ path: fullFile, fullPage: true, animations: 'disabled' });

            const height = Math.max(pageData.document.scrollHeight, VIEWPORT.height);
            const maxScroll = Math.max(0, height - VIEWPORT.height);
            const positions = [];
            for (let top = 0; top < maxScroll; top += STEP) positions.push(top);
            positions.push(maxScroll);

            const screenshots = [];
            for (const [index, top] of uniqueNumbers(positions).entries()) {
              await page.evaluate((y) => window.scrollTo(0, y), top);
              await page.waitForTimeout(400);
              const actualTop = await page.evaluate(() => Math.round(scrollY));
              const fileName = `${slug}-${String(index + 1).padStart(2, '0')}-y${String(actualTop).padStart(4, '0')}.png`;
              const filePath = path.join(SEGMENTS, fileName);
              await page.screenshot({ path: filePath, fullPage: false, animations: 'disabled' });
              screenshots.push({ fileName, requestedTop: top, actualTop, sha256: await hash(filePath) });
            }

            const states = [];
            if (slug === 'how-it-works') {
              const faq = page.getByText('Who can join AgriLoop?', { exact: true }).first();
              if (await faq.count()) {
                await faq.scrollIntoViewIfNeeded().catch(() => {});
                await faq.click().catch(() => {});
                await page.waitForTimeout(600);
                const fileName = 'how-it-works-faq-expanded-1920x1080.png';
                const filePath = path.join(STATES, fileName);
                await page.screenshot({ path: filePath, fullPage: false, animations: 'disabled' });
                states.push({ fileName, sha256: await hash(filePath) });
              }
            }

            manifest.routes.push({
              slug,
              requestedUrl,
              finalUrl: pageData.url,
              httpStatus: response?.status() ?? null,
              navigationError,
              title: pageData.title,
              viewport: pageData.viewport,
              document: pageData.document,
              fullPage: { fileName: path.basename(fullFile), sha256: await hash(fullFile) },
              screenshots,
              states,
              dataFile: path.basename(dataFile),
              htmlFile: path.basename(htmlFile)
            });
            await page.close();
          }

          manifest.discoveredInternalPaths.sort();
          await fs.writeFile(path.join(ROOT, 'manifest.json'), JSON.stringify(manifest, null, 2));
          await fs.writeFile(path.join(ROOT, 'README.txt'), [
            'AgriLoop live public-site capture',
            `Captured UTC: ${manifest.capturedAtUtc}`,
            'Viewport: 1920 x 1080 CSS pixels, DPR 1, exact 16:9',
            `Segment overlap: ${OVERLAP} pixels`,
            '',
            'segments-1920x1080/: sequential viewport screenshots covering every captured page',
            'full-page/: full-document PNGs',
            'interaction-states/: additional visible component states',
            'page-data/: live DOM geometry, computed-style, asset, form and route inventories',
            'html-snapshots/: rendered HTML at capture time',
            'manifest.json: route status, dimensions, hashes and screenshot order'
          ].join('\n'));

          console.log(JSON.stringify(manifest, null, 2));
          await browser.close();
          EOF

          node capture-agriloop.mjs

      - name: Upload capture package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agriloop-live-capture-1920x1080
          path: capture-output
          if-no-files-found: error
          retention-days: 7
